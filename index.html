<!doctype html>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--felt:#174438;--wood:#704326;--gold:#d8b36d;--paper:#f0e4c6;--ink:#514a38}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif}
body{min-height:100vh;padding:clamp(10px,2.3vw,30px);background:radial-gradient(ellipse at 50% 30%,#29483d,#10231f 78%);display:grid;place-items:center}
.table{width:min(1600px,100%);padding:clamp(10px,1.5vw,22px);border:clamp(8px,1.2vw,16px) solid var(--wood);border-radius:28px;background:linear-gradient(145deg,#28604e,#174438 55%,#10352d);box-shadow:inset 0 0 0 2px #d9b776,inset 0 0 0 6px #4c2e1d,0 28px 80px #0009;position:relative}
.table:before{content:"";position:absolute;inset:7px;border:1px solid #e4c68a66;border-radius:15px;pointer-events:none}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 8px 15px;color:#f2e7cb}
.kicker{font-size:10px;letter-spacing:3px;font-weight:800;color:#e0c184}
h1{font:700 clamp(23px,3vw,38px)/1.05 'Playfair Display',serif;margin:5px 0 0}
.edition{font-size:10px;letter-spacing:1.5px;text-align:right;color:#d1d9c9}
.board{position:relative;background:linear-gradient(145deg,#f4ebd5,#e5d5b3);padding:clamp(7px,1.1vw,15px);border-radius:15px;border:1px solid #b99c68;box-shadow:0 8px 22px #061a1655,inset 0 0 0 2px #fff9e9}
.map-title{display:flex;justify-content:space-between;gap:8px;padding:2px 7px 10px;color:#6c6047;font-size:10px;font-weight:800;letter-spacing:1.8px}
.map-wrap{position:relative;overflow:hidden;border:1px solid #b5a37a;border-radius:9px;background:#d8d3b8;box-shadow:inset 0 0 30px #655b4222}
svg{display:block;width:100%;height:auto}
.ocean{fill:#d8d3b8}
.land{fill:#b8b994;stroke:#8c987b;stroke-width:2.3;stroke-linejoin:round}
.island{fill:#c0bd98;stroke:#939b7c;stroke-width:1.5}
.coast-detail{fill:none;stroke:#f0e8cf;stroke-width:2;opacity:.55}
.gridline{fill:none;stroke:#a5aa8d;stroke-width:1;opacity:.34;stroke-dasharray:4 9}
.route-shadow{fill:none;stroke:#f6ebce;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.route{fill:none;stroke:#a96f35;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 10}
.city-dot{fill:#f8edce;stroke:#815b2d;stroke-width:4}
.city-ring{fill:none;stroke:#a96f35;stroke-width:2;opacity:.7}
.city-label{font:700 17px 'DM Sans',sans-serif;fill:#554b36;paint-order:stroke;stroke:#eee4ca;stroke-width:5;stroke-linejoin:round}
.city-sub{font:600 11px 'DM Sans',sans-serif;fill:#82765a;paint-order:stroke;stroke:#eee4ca;stroke-width:4}
.continent{font:700 20px 'Playfair Display',serif;letter-spacing:4px;fill:#82866b;opacity:.72}
.compass{fill:#8b7044;opacity:.85}
.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 8px 2px;color:#e8dfc9;font-size:9px;letter-spacing:1.4px}
.legend{display:flex;align-items:center;gap:7px}.legend-line{width:28px;border-top:3px dashed #d9b16c}
@media(max-width:700px){body{padding:6px}.table{border-radius:18px;padding:8px;border-width:8px}.header{padding:4px 4px 10px}.edition{font-size:8px}.map-title{font-size:8px;letter-spacing:1px}.city-label{font-size:19px}.city-sub{font-size:13px}.continent{font-size:24px}.footer{font-size:8px;flex-wrap:wrap}}
</style>
</head>
